<div class="padding-24">
  <div>
    <button (click)="unshift()">Unshift data</button>
    <button (click)="push()">Push data</button>
    <button (click)="reset()">Reset data</button>
  </div>
  <div>
    Length : {{data.length}}
  </div>
  <MyTable [data]="data" >
    <MyTableHeadRow>
      <MyTableHeadCell *MyTableHeadCellDef="'index'" >#</MyTableHeadCell>
      <MyTableHeadCell *MyTableHeadCellDef="'file'" >File</MyTableHeadCell>
      <MyTableHeadCell *MyTableHeadCellDef="'author'" >Author</MyTableHeadCell>
      <MyTableHeadCell *MyTableHeadCellDef="'lastUpdated'">Last updated</MyTableHeadCell>
      <MyTableHeadCell *MyTableHeadCellDef="'lastUpdate'">Last update</MyTableHeadCell>
      <MyTableHeadCell *MyTableHeadCellDef="'action'"> </MyTableHeadCell>
    </MyTableHeadRow>

    <MyTableRow *MyTableRowDef="let value=value; index as i">
      <MyTableCell *MyTableCellDef="'index'">{{i}}</MyTableCell>
      <MyTableCell *MyTableCellDef="'file'">{{value.file.label}}</MyTableCell>
      <MyTableCell *MyTableCellDef="'author'">{{value.author.label}}</MyTableCell>
      <MyTableCell *MyTableCellDef="'lastUpdated'">{{value.lastUpdated.label}}</MyTableCell>
      <MyTableCell *MyTableCellDef="'lastUpdate'">{{value.lastUpdate.label}}</MyTableCell>
      <MyTableCell *MyTableCellDef="'action'">
        <button MyIconButton (click)="delete(i)">
          <MyMaterialIcon>delete</MyMaterialIcon>
        </button>
      </MyTableCell>
    </MyTableRow>
  </MyTable>
</div>
